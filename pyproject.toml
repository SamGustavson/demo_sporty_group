[tool.poetry]
name = "sporty-qa-framework"
version = "0.1.0"
description = "Test framework for the Sporty Group assignment"
authors = ["Alex"]
readme = "README.md"
packages = [{ include = "core" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
selenium = "^4.25.0"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
jsonschema = "^4.23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.7.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "api: API tests using requests",
  "ui: browser-based Selenium tests",
  "smoke: high-priority smoke tests"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
